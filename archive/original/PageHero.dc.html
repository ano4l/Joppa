<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;background:#131A33;padding:clamp(120px,16vw,180px) 0 clamp(56px,8vw,96px);overflow:hidden;">
  <div style="position:absolute;inset:0;background:#131A33;background-image:repeating-linear-gradient(135deg,rgba(244,241,235,0.04) 0,rgba(244,241,235,0.04) 1px,transparent 1px,transparent 13px);"></div>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(244,241,235,0.16);">{{ label }}</div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,17,36,0.75) 0%,rgba(13,17,36,0.55) 60%,rgba(13,17,36,0.9) 100%);"></div>
  <div style="position:relative;max-width:1340px;margin:0 auto;padding:0 clamp(20px,5vw,48px);">
    <div style="max-width:860px;">
      <div style="display:inline-flex;align-items:center;gap:11px;color:#00B9F2;font-size:13px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:24px;">
        <span style="width:34px;height:1px;background:#102694;"></span>{{ eyebrow }}
      </div>
      <h1 style="font-family:'Spectral',serif;font-weight:400;font-size:clamp(36px,5.5vw,68px);line-height:1.05;letter-spacing:-0.015em;color:#F6F2EB;margin:0;">{{ title }}</h1>
      <p style="max-width:600px;color:rgba(244,241,235,0.76);font-size:clamp(16px,1.5vw,19px);line-height:1.65;margin:24px 0 0;">{{ subtitle }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:520},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About JOPPA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page title goes here&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A short supporting sentence for this page.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;image · 21:9&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
